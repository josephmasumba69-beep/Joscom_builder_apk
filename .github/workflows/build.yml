[app]

# (str) Title of your application
title = Joscom Studio

# (str) Package name
package.name = joscomstudio

# (str) Package domain (needed for android/ios packaging)
package.domain = org.joscom.studio

# (str) Source code where the main.py live
source.dir = .

# (list) Source files to include (let empty to include source.dir)
source.include_exts = py,png,jpg,kv,atlas,txt,json,md

# (list) List of inclusions using pattern matching
#source.include_patterns = assets/*,images/*.png

# (list) Source files to exclude (let empty to not exclude anything)
#source.exclude_exts = spec

# (list) List of directory to exclude (let empty to not exclude anything)
#source.exclude_dirs = tests, bin, .github

# (list) List of exclusions using pattern matching
#source.exclude_patterns = license,images/*/*.jpg

# (str) Application versioning (method 1)
version = 1.0

# (str) Application versioning (method 2)
# version.regex = __version__ = ['"](.*)['"]
# version.filename = %(source.dir)s/main.py

# (list) Application requirements
# comma separated e.g. requirements = sqlite3,kivy
requirements = python3,kivy==2.3.0,kivymd==1.2.0,requests,plyer,pillow

# (str) Custom source folders for requirements
#requirements.source.kivy = ../../kivy

# (str) Presplash of the application
#presplash.filename = %(source.dir)s/data/presplash.png

# (str) Icon of the application
#icon.filename = %(source.dir)s/data/icon.png

# (str) Supported orientation (one of landscape, sensor, portrait or all)
orientation = portrait

# (list) List of service to declare
#services = NAME:ENTRYPOINT_TO_PY,NAME2:ENTRYPOINT2_TO_PY

#
# OSX Specific
#

#
# Android specific
#

# (bool) Indicate if the application should be fullscreen or not
fullscreen = 0

# (string) Presplash background color (for android toolchain)
# Supported formats are: #RRGGBB #AARRGGBB or one of "black", "white", "red", "green", "blue", "yellow", "cyan", "magenta", "gray", "lightgray", "darkgray"
android.presplash_color = #1A1A1A

# (string) Presplash theme (for android toolchain)
# Supported themes are: "Theme.Light", "Theme.Light.NoTitleBar", "Theme.Black", "Theme.Black.NoTitleBar", "Theme.Holo", "Theme.Holo.NoTitleBar"
#android.presplash_theme = Theme.Black.NoTitleBar

# (list) Android application meta-data to set (key=value format)
#android.meta_data =

# (list) Android library project to add (will be added in the resulting project folder)
#android.library_references =

# (list) Android logcat filters to use
#android.logcat_filters = *:S python:D

# (str) Android logcat only display log for activity's pid
#android.logcat_pid_only = False

# (str) Android app theme (for android toolchain)
# Supported themes are: "Theme.AppCompat.Light", "Theme.AppCompat.Light.DarkActionBar", "Theme.AppCompat.Light.NoActionBar"
android.theme = Theme.AppCompat.Light.NoActionBar

# (str) Android permissions
android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO

# (int) Android API to use
android.api = 33

# (int) Minimum API required
android.minapi = 24

# (int) Android SDK version to use
android.sdk = 33

# (str) Android NDK version to use
android.ndk = 25b

# (int) Android NDK API to use
android.ndk_api = 24

# (bool) Use --private data storage (True) or --dir public storage (False)
#android.private_storage = True

# (str) Android NDK directory (if empty, it will be automatically downloaded.)
#android.ndk_path =

# (str) Android SDK directory (if empty, it will be automatically downloaded.)
#android.sdk_path =

# (str) ANT directory (if empty, it will be automatically downloaded.)
#android.ant_path =

# (bool) If True, then skip trying to update the Android sdk
#android.skip_update = False

# (bool) If True, then automatically accept SDK license agreements
android.accept_sdk_license = True

# (str) Android entry point, default is ok for Kivy-based app
#android.entrypoint = org.kivy.android.PythonActivity

# (str) Android app theme, default is ok for Kivy-based app
#android.apptheme = "@android:style/Theme.NoTitleBar"

# (list) Pattern to whitelist for the whole project
#android.whitelist =

# (str) Path to a custom Kivy APK to install (for testing)
#android.apk_path =

# (bool) If True, then building will be done in debug mode
#android.debug = False

# (str) Android release mode, if True, then build will be done in release mode
#android.release = False

# (str) Android arch to use
android.archs = arm64-v8a,armeabi-v7a

# (str) Android build tools version to use
#android.build_tools_version = 33.0.0

# (bool) If True, then use Gradle to build the APK
#android.use_gradle = True

# (str) Android build mode
#android.build_mode = debug

# (str) Android logcat filters
#android.logcat_filters =

# (bool) If True, then use Android App Bundle (AAB) instead of APK
#android.use_aab = False

#
# iOS specific
#

# (str) Name of the iOS bundle
#ios.bundle_id = org.joscom.studio

# (str) Name of the iOS app
#ios.app_name = Joscom Studio

#
# Buildozer internal
#

# (str) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (str) The default buildozer log level
#log_level = 1

# (str) Path to buildozer log file
#log_file = buildozer.log

# (str) Path to buildozer cache
#buildozer_cache = .buildozer

# (str) Path to buildozer build folder
#buildozer_build = .buildozer

# (str) Path to buildozer dist folder
#buildozer_dist = dist
